<p>---</p>
<p>데이터 마이너, 나는 프로그램 코드 깊숙이 숨어 있는 미사용 모델을 발견하며 게임 파일에서 발견된 미공개 데이터를 들여다 본다. 이번에 발견한 것은 다크소울 1편 출시 전 데모 버전에서만 존재했던 지역과 적 배치의 차이였다.</p>
